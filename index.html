<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Attendance System | Government Engineering College</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a' // Deep Navy Blue
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- HTML5 QR Code Camera Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .animate-pulse-glow { animation: pulseGlow 2s infinite; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
      50% { box-shadow: 0 0 25px rgba(37, 99, 235, 0.8); }
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen antialiased flex flex-col transition-colors duration-200">

  <!-- MAIN APP CONTAINER -->
  <div id="app" class="flex-1 flex flex-col min-h-0">
    <!-- Rendered dynamically via SPA Router -->
  </div>

  <!-- UNIVERSAL ADD/EDIT USER MODAL -->
  <div id="user-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="bg-brand-900 text-white px-6 py-4 flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-base"><i class="fa-solid fa-user-gear mr-2"></i>User Details</h3>
        <button onclick="closeUserModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleUserFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="modal-user-id" value="" />

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">User Role</label>
          <select id="modal-role" onchange="toggleModalRoleFields()" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="mentor">Mentor</option>
            <option value="parent">Parent</option>
            <option value="hod">HOD</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Full Name *</label>
          <input type="text" id="modal-name" required placeholder="e.g. Rahul Sharma" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
            <input type="email" id="modal-email" placeholder="user@attendance.com" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
            <input type="text" id="modal-phone" placeholder="+91 9876543210" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
          </div>
        </div>

        <!-- Student Specific Fields -->
        <div id="modal-student-fields" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Roll Number (Student ID) *</label>
              <input type="text" id="modal-roll" placeholder="STU104" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Department</label>
              <select id="modal-dept" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electrical Engineering">Electrical Engineering</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Semester</label>
              <select id="modal-sem" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
                <option value="6">Semester 6</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Section</label>
              <select id="modal-section" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
                <option value="A">Section A</option>
                <option value="B">Section B</option>
                <option value="C">Section C</option>
              </select>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input type="password" id="modal-password" placeholder="Leave empty to keep default" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
        </div>

        <div id="modal-err-msg" class="hidden p-2.5 rounded-xl bg-rose-100 border border-rose-300 text-rose-700 text-xs font-medium text-center"></div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeUserModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 text-xs font-semibold hover:bg-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-brand-700 text-white text-xs font-bold shadow-md hover:bg-brand-800">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FLOATING AI CHATBOT WIDGET -->
  <div id="chatbot-container" class="hidden fixed bottom-5 right-5 z-50">
    <button onclick="toggleChatbot()" class="w-14 h-14 rounded-full bg-brand-700 hover:bg-brand-800 text-white flex items-center justify-center shadow-2xl animate-pulse-glow transition transform hover:scale-105">
      <i class="fa-solid fa-robot text-2xl"></i>
    </button>

    <div id="chat-window" class="hidden absolute bottom-16 right-0 w-80 sm:w-96 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col h-[460px]">
      <div class="bg-brand-900 text-white p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
          </div>
          <div>
            <h4 class="font-bold text-sm">College Attendance Assistant</h4>
            <p class="text-xs text-brand-100 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Online</p>
          </div>
        </div>
        <button onclick="toggleChatbot()" class="text-white/80 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 dark:bg-slate-900 text-xs sm:text-sm">
        <div class="flex gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-700 text-white flex items-center justify-center text-xs flex-shrink-0">AI</div>
          <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-200 dark:border-slate-700 shadow-sm max-w-[85%] text-slate-700 dark:text-slate-200">
            Namaste! How can I assist you with your attendance or institutional metrics today?
          </div>
        </div>
      </div>

      <div class="p-2 bg-slate-100 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex gap-1.5 overflow-x-auto text-[11px]">
        <button onclick="sendQuickChat('What is my attendance percentage?')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-medium hover:bg-brand-50">📊 My Percentage</button>
        <button onclick="sendQuickChat('What are the attendance rules?')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-medium hover:bg-brand-50">📋 Rules</button>
      </div>

      <form onsubmit="handleChatSubmit(event)" class="p-3 bg-white dark:bg-slate-850 border-t border-slate-200 dark:border-slate-700 flex gap-2">
        <input type="text" id="chat-input" placeholder="Ask attendance query..." class="flex-1 px-3 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" autocomplete="off" />
        <button type="submit" class="px-4 py-2 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-medium text-xs transition">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Global Application State
    let state = {
      user: null,
      token: localStorage.getItem('token') || null,
      theme: localStorage.getItem('theme') || 'light',
      selectedRolePortal: null, // 'admin' | 'faculty' | 'student' | 'mentor' | 'parent' | 'hod'
      currentTab: 'dashboard',
      students: [],
      faculty: [],
      mentors: [],
      parents: [],
      hods: [],
      users: [],
      attendance: [],
      alerts: [],
      notifications: [],
      subjectSummaries: [],
      subjects: [],
      selectedSubject: 'Data Structures',
      summary: null,
      metrics: null,
      activeQRSession: null,
      qrCountdownInterval: null,
      qrSecondsLeft: 0,
      html5QrCodeInstance: null,
      isScanning: false,
      searchQuery: '',
      filterDepartment: '',
      filterSemester: '',
      filterDate: ''
    };

    const API_BASE = '/api';

    // 6 Role Portals Metadata Definitions
    const ROLE_PORTALS = {
      student: { name: 'Student Portal', icon: 'fa-user-graduate', bgFrom: 'from-blue-600', bgTo: 'to-blue-800', email: 'rahul@attendance.com' },
      faculty: { name: 'Faculty Portal', icon: 'fa-chalkboard-user', bgFrom: 'from-indigo-600', bgTo: 'to-brand-900', email: 'rajesh@attendance.com' },
      mentor:  { name: 'Mentor Portal', icon: 'fa-handshake', bgFrom: 'from-teal-600', bgTo: 'to-emerald-800', email: 'vikram@attendance.com' },
      parent:  { name: 'Parent Portal', icon: 'fa-user-group', bgFrom: 'from-amber-600', bgTo: 'to-orange-800', email: 'sunita@attendance.com' },
      hod:     { name: 'HOD Portal', icon: 'fa-building-columns', bgFrom: 'from-rose-600', bgTo: 'to-pink-900', email: 'suresh@attendance.com' },
      admin:   { name: 'Admin Portal', icon: 'fa-user-gear', bgFrom: 'from-brand-800', bgTo: 'to-slate-900', email: 'admin' }
    };

    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      if (state.token) {
        fetchCurrentUser();
      } else {
        renderPortalSelect();
      }
    });

    function initTheme() {
      if (state.theme === 'dark' || (!state.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        state.theme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        state.theme = 'light';
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', state.theme);
      initTheme();
      renderApp();
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (state.token) headers['Authorization'] = `Bearer ${state.token}`;

      try {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          method,
          headers,
          body: body ? JSON.stringify(body) : null
        });
        return await res.json();
      } catch (e) {
        console.error('API Network Error:', e);
        return { success: false, message: 'Server connection error' };
      }
    }

    async function fetchCurrentUser() {
      const res = await apiRequest('/auth/me');
      if (res.success) {
        state.user = res.user;
        document.getElementById('chatbot-container').classList.remove('hidden');
        fetchDashboardData();
      } else {
        logout();
      }
    }

    async function fetchDashboardData() {
      if (!state.user) return;

      const queryStr = [];
      if (state.searchQuery) queryStr.push(`search=${encodeURIComponent(state.searchQuery)}`);
      if (state.filterDepartment) queryStr.push(`department=${encodeURIComponent(state.filterDepartment)}`);
      if (state.filterSemester) queryStr.push(`semester=${encodeURIComponent(state.filterSemester)}`);
      if (state.filterDate) queryStr.push(`date=${encodeURIComponent(state.filterDate)}`);
      const attUrl = `/attendance/list${queryStr.length ? '?' + queryStr.join('&') : ''}`;

      const [metricsRes, attRes, stRes, facRes, alertsRes, notifRes, subjSumRes] = await Promise.all([
        apiRequest('/reports/metrics'),
        apiRequest(attUrl),
        apiRequest('/students'),
        apiRequest('/faculty'),
        apiRequest('/alerts/low-attendance'),
        apiRequest('/notifications/history'),
        apiRequest('/attendance/subject-summary')
      ]);

      if (metricsRes.success) state.metrics = metricsRes.metrics;
      if (attRes.success) state.attendance = attRes.attendance;
      if (stRes.success) state.students = stRes.students;
      if (facRes.success) state.faculty = facRes.faculty;
      if (alertsRes.success) state.alerts = alertsRes.alerts || [];
      if (notifRes.success) state.notifications = notifRes.notifications || [];
      if (subjSumRes.success) state.subjectSummaries = subjSumRes.subjectSummaries || [];

      if (state.user.role === 'admin') {
        const usersRes = await apiRequest('/users');
        if (usersRes.success) state.users = usersRes.users;
      }

      if (['student', 'parent'].includes(state.user.role)) {
        const sumRes = await apiRequest('/attendance/summary');
        if (sumRes.success) state.summary = sumRes;
      }

      renderApp();
    }

    function logout() {
      stopCameraScanner();
      state.token = null;
      state.user = null;
      state.selectedRolePortal = null;
      localStorage.removeItem('token');
      document.getElementById('chatbot-container').classList.add('hidden');
      renderPortalSelect();
    }

    // 1. PORTAL SELECTION LANDING HUB (6 PORTALS)
    function renderPortalSelect() {
      const appEl = document.getElementById('app');
      appEl.innerHTML = `
        <div class="flex-1 flex flex-col justify-center items-center p-6 bg-gradient-to-br from-brand-900 via-blue-900 to-slate-900 text-white relative overflow-hidden">
          <div class="max-w-4xl w-full text-center space-y-3 mb-10">
            <div class="w-16 h-16 rounded-2xl bg-brand-600 mx-auto flex items-center justify-center text-3xl shadow-2xl shadow-brand-500/40 border border-white/20">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Smart Attendance System</h1>
            <p class="text-xs sm:text-sm text-blue-200 max-w-xl mx-auto font-medium">Government Engineering College | Select Role Portal to Login</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 max-w-5xl w-full">
            ${Object.entries(ROLE_PORTALS).map(([roleKey, portal]) => `
              <div onclick="openRoleLogin('${roleKey}')" class="bg-white/10 hover:bg-white/20 border border-white/15 rounded-2xl p-5 cursor-pointer transition transform hover:-translate-y-1.5 hover:shadow-2xl flex flex-col items-center text-center space-y-3 backdrop-blur-md group">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-br ${portal.bgFrom} ${portal.bgTo} flex items-center justify-center text-2xl text-white shadow-lg border border-white/20 group-hover:scale-110 transition">
                  <i class="fa-solid ${portal.icon}"></i>
                </div>
                <div>
                  <h3 class="font-bold text-base text-white">${portal.name}</h3>
                  <p class="text-[11px] text-blue-200 mt-0.5 capitalize">${roleKey} authentication & dashboard</p>
                </div>
                <span class="text-xs font-semibold text-brand-200 group-hover:underline flex items-center gap-1">
                  Access Portal <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openRoleLogin(roleKey) {
      state.selectedRolePortal = roleKey;
      renderRoleLoginScreen();
    }

    // 2. DEDICATED ROLE LOGIN SCREENS
    function renderRoleLoginScreen() {
      const portal = ROLE_PORTALS[state.selectedRolePortal || 'student'];
      const appEl = document.getElementById('app');

      const isDefaultAdmin = state.selectedRolePortal === 'admin';

      appEl.innerHTML = `
        <div class="flex-1 flex items-center justify-center p-4 bg-gradient-to-br ${portal.bgFrom} ${portal.bgTo} text-white">
          <div class="w-full max-w-md bg-slate-900/95 border border-slate-700/80 rounded-3xl shadow-2xl p-8 backdrop-blur-xl relative overflow-hidden">
            <button onclick="renderPortalSelect()" class="text-xs text-slate-400 hover:text-white mb-6 flex items-center gap-1.5 transition font-medium">
              <i class="fa-solid fa-arrow-left"></i> Change Portal
            </button>

            <div class="text-center space-y-2 mb-8">
              <div class="w-16 h-16 rounded-2xl bg-white/10 mx-auto flex items-center justify-center text-3xl text-white shadow-lg border border-white/20">
                <i class="fa-solid ${portal.icon}"></i>
              </div>
              <h2 class="text-2xl font-extrabold tracking-tight">${portal.name}</h2>
              <p class="text-xs text-slate-400">Enter authorized credentials for ${state.selectedRolePortal.toUpperCase()} access.</p>
            </div>

            <form onsubmit="handleRoleLoginSubmit(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Username / Email</label>
                <div class="relative">
                  <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                  <input type="text" id="login-identity" required value="${isDefaultAdmin ? 'admin' : portal.email}" class="w-full pl-10 pr-4 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                  <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                  <input type="password" id="login-password" required value="${isDefaultAdmin ? 'admin123' : 'password123'}" class="w-full pl-10 pr-4 py-2.5 bg-slate-800/90 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:ring-2 focus:ring-brand-500" />
                </div>
              </div>

              <div id="login-error-msg" class="hidden p-3 rounded-xl bg-rose-950/80 border border-rose-800 text-rose-300 text-xs text-center font-medium"></div>

              <button type="submit" class="w-full py-3 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-lg transition transform hover:-translate-y-0.5">
                Sign In to ${portal.name}
              </button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleRoleLoginSubmit(e) {
      e.preventDefault();
      const identity = document.getElementById('login-identity').value;
      const password = document.getElementById('login-password').value;
      const role = state.selectedRolePortal;

      const res = await apiRequest('/auth/login', 'POST', { username: identity, email: identity, password, role });
      const errBox = document.getElementById('login-error-msg');

      if (res.success) {
        state.token = res.token;
        state.user = res.user;
        localStorage.setItem('token', res.token);
        document.getElementById('chatbot-container').classList.remove('hidden');
        fetchDashboardData();
      } else {
        errBox.classList.remove('hidden');
        errBox.innerText = res.message || 'Invalid credentials';
      }
    }

    // 3. MAIN PROTECTED APPLICATION CONTROLLER
    function renderApp() {
      const appEl = document.getElementById('app');
      if (!state.user) {
        renderPortalSelect();
        return;
      }

      appEl.innerHTML = `
        <div class="flex-1 flex overflow-hidden">
          <!-- SIDEBAR (INDIAN COLLEGE BLUE THEME) -->
          <aside class="w-64 bg-brand-900 text-white flex flex-col flex-shrink-0 hidden md:flex transition-all shadow-xl">
            <div class="p-5 border-b border-brand-800 flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-white text-brand-900 flex items-center justify-center font-extrabold text-xl shadow-lg">
                <i class="fa-solid fa-graduation-cap"></i>
              </div>
              <div>
                <h2 class="font-extrabold text-sm leading-tight text-white">Smart Attendance</h2>
                <p class="text-[11px] text-brand-200 capitalize font-medium">${state.user.role} Dashboard</p>
              </div>
            </div>

            <!-- Navigation Links Matrix -->
            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
              ${renderNavBtn('dashboard', 'fa-gauge-high', 'Dashboard')}

    function renderNavBtn(tab, icon, label) {
      const active = state.currentTab === tab;
      return `
        <button onclick="switchTab('${tab}')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-xs transition ${
          active 
            ? 'bg-white text-brand-900 font-bold shadow-md' 
            : 'text-brand-100 hover:bg-brand-800 hover:text-white'
        }">
          <i class="fa-solid ${icon} text-sm"></i>
          <span>${label}</span>
        </button>
      `;
    }

    function switchTab(tab) {
      if (state.currentTab === 'qr-scan' && tab !== 'qr-scan') {
        stopCameraScanner();
      }
      state.currentTab = tab;
      renderApp();
    }

    // PROTECTED ROUTE MATRIX
    function renderProtectedTabContent() {
      const role = state.user.role;
      const tab = state.currentTab;

      if (tab === 'user-management' && role !== 'admin') return renderAccessDenied();
      if (tab === 'academic-modules' && role !== 'admin') return renderAccessDenied();
      if (tab === 'students' && !['admin', 'faculty', 'mentor', 'hod'].includes(role)) return renderAccessDenied();
      if (tab === 'faculty' && !['admin', 'hod'].includes(role)) return renderAccessDenied();
      if (tab === 'qr-session' && !['faculty', 'admin'].includes(role)) return renderAccessDenied();
      if (tab === 'qr-scan' && role !== 'student') return renderAccessDenied();

      switch (tab) {
        case 'dashboard': return renderRoleDashboard();
        case 'user-management': return renderUserManagementPage();
        case 'students': return renderStudentsPage();
        case 'faculty': return renderFacultyPage();
        case 'academic-modules': return renderAcademicModulesPage();
        case 'qr-session': return renderQRSessionPage();
        case 'qr-scan': return renderCameraQRScanPage();
        case 'attendance-records': return renderAttendanceRecordsPage();
        case 'notification-history': return renderNotificationHistoryPage();
        case 'reports': return renderReportsPage();
        default: return renderRoleDashboard();
      }
    }

    function renderAccessDenied() {
      return `
        <div class="p-8 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-center space-y-3">

    function renderFacultyStudentAttendanceRows() {
      if (!state.students || state.students.length === 0) {
        return `<tr><td colspan="7" class="py-4 text-center text-slate-400">No student records found.</td></tr>`;
      }

      let filteredStudents = state.students;
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        filteredStudents = filteredStudents.filter(s => s.name.toLowerCase().includes(q) || s.roll_number.toLowerCase().includes(q));
      }
      if (state.filterDepartment) {
        filteredStudents = filteredStudents.filter(s => s.department === state.filterDepartment);
      }
      if (state.filterSemester) {
        filteredStudents = filteredStudents.filter(s => String(s.semester) === String(state.filterSemester));
      }

      const currentDate = state.filterDate || new Date().toISOString().split('T')[0];

      return filteredStudents.map(s => {
        const studentAtts = state.attendance.filter(a => a.raw_student_id === s.user_id || a.roll_number === s.roll_number);
        const dateRecord = studentAtts.find(a => a.date === currentDate && (a.subject === (state.selectedSubject || 'Data Structures')));
        
        const attended = studentAtts.filter(a => a.status === 'PRESENT').length;
        const total = studentAtts.length;
        const pct = total > 0 ? ((attended / total) * 100).toFixed(1) : '100.0';

        const currentStatus = dateRecord ? dateRecord.status : 'ABSENT';

        const hasLowAtt = (state.alerts || []).some(a => a.student_id === s.user_id && a.status === 'ACTIVE');
        const lowAttAlert = (state.alerts || []).find(a => a.student_id === s.user_id && a.status === 'ACTIVE');

        return `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50">
            <td class="py-3 px-3 font-bold text-slate-900 dark:text-white">${s.roll_number}</td>
            <td class="py-3 px-3 font-medium dark:text-slate-200">
              ${s.name}
              ${hasLowAtt ? `
                <span title="Low Attendance in ${lowAttAlert?.subject} (${lowAttAlert?.percentage}%)" class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-extrabold bg-rose-600 text-white shadow-sm inline-flex items-center gap-1 animate-pulse">
                  <i class="fa-solid fa-triangle-exclamation"></i> Low Attendance (${lowAttAlert?.subject}: ${lowAttAlert?.percentage}%)
                </span>
              ` : ''}
            </td>
            <td class="py-3 px-3 text-slate-500">${s.department} (Sem ${s.semester})</td>
            <td class="py-3 px-3 text-slate-500">${currentDate}</td>
            <td class="py-3 px-3">
              <span class="px-2.5 py-1 rounded-md text-[10px] font-bold ${currentStatus === 'PRESENT' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                ${currentStatus}
              </span>
            </td>
            <td class="py-3 px-3 font-semibold ${parseFloat(pct) < 75 ? 'text-rose-600' : 'text-emerald-600'}">${pct}%</td>
            <td class="py-3 px-3 text-right space-x-1">
              <button onclick="markManualAttendance(${s.user_id}, 'PRESENT', '${currentDate}')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold text-[11px] hover:bg-emerald-700">Present</button>
              <button onclick="markManualAttendance(${s.user_id}, 'ABSENT', '${currentDate}')" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-semibold text-[11px] hover:bg-rose-700">Absent</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function handleSearchChange(e) {
      state.searchQuery = e.target.value;
      fetchDashboardData();
    }

    function handleDeptFilterChange(e) {
      state.filterDepartment = e.target.value;

    function handleSubjectSelectChange(e) {

    function clearFilters() {
      state.searchQuery = '';
      state.filterDepartment = '';
      state.filterSemester = '';
      state.filterDate = '';
      fetchDashboardData();
    }

    async function markManualAttendance(student_id, status, date) {
      const subject = state.selectedSubject || 'Data Structures';
      const res = await apiRequest('/attendance/mark', 'POST', { student_id, status, date, subject });
      if (res.success) {
        fetchDashboardData();
      } else {
        alert(res.message);
      }
    }

    async function startQRSession() {
      const duration_minutes = parseInt(document.getElementById('qr-duration').value);

      const res = await apiRequest('/qr/generate', 'POST', { duration_minutes });
      if (res.success) {
        state.activeQRSession = res.qrSession;
        const container = document.getElementById('qr-display-container');
        const holder = document.getElementById('qr-image-holder');
        container.classList.remove('hidden');

        holder.innerHTML = `<img src="${res.qrSession.qrImageURL}" class="w-64 h-64 rounded-xl shadow-md border bg-white p-2" />`;
        document.getElementById('qr-details-text').innerText = `Session QR Token: ${res.qrSession.token}`;

        state.qrSecondsLeft = duration_minutes * 60;
        clearInterval(state.qrCountdownInterval);
        state.qrCountdownInterval = setInterval(() => {
          state.qrSecondsLeft--;
          const mins = Math.floor(state.qrSecondsLeft / 60);
          const secs = state.qrSecondsLeft % 60;
          document.getElementById('qr-timer-text').innerText = `⏳ Session Expiration Countdown: ${mins}m ${secs < 10 ? '0' : ''}${secs}s`;

          if (state.qrSecondsLeft <= 0) {
            clearInterval(state.qrCountdownInterval);
            document.getElementById('qr-timer-text').innerText = '❌ QR Code Expired';
          }
        }, 1000);
      } else {
        alert(res.message);
      }
    }

    async function stopQRSession() {
      if (state.activeQRSession) {
        await apiRequest('/qr/stop', 'POST', { qr_id: state.activeQRSession.id });
        clearInterval(state.qrCountdownInterval);
        document.getElementById('qr-display-container').classList.add('hidden');
        alert('QR Session ended manually.');
      }
    }

    async function startCameraScanner() {
      const alertBox = document.getElementById('scan-status-alert');
      if (alertBox) alertBox.classList.add('hidden');

      try {
        if (state.html5QrCodeInstance && state.isScanning) {
          await state.html5QrCodeInstance.stop();
          state.isScanning = false;
        }

        if (!state.html5QrCodeInstance) {
          state.html5QrCodeInstance = new Html5Qrcode("reader");
        }

        const startBtn = document.getElementById('btn-start-camera');
        const stopBtn = document.getElementById('btn-stop-camera');
        if (startBtn) startBtn.classList.add('hidden');
        if (stopBtn) stopBtn.classList.remove('hidden');

        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
          handleScannedToken(decodedText);
        };

        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        state.html5QrCodeInstance.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
          .then(() => {
            state.isScanning = true;
          })
          .catch(async (err) => {
            try {
              const cameras = await Html5Qrcode.getCameras();
              if (cameras && cameras.length > 0) {
                await state.html5QrCodeInstance.start(cameras[0].id, config, qrCodeSuccessCallback);
                state.isScanning = true;
              } else {
                showScanError('No camera detected on this device.');
              }
            } catch (e) {
              showScanError('Camera permission denied or camera unavailable. Please allow camera access in browser.');
            }
          });
      } catch (err) {
        showScanError('Camera initialization error: ' + err.message);
      }
    }

    async function stopCameraScanner() {
      if (state.html5QrCodeInstance && state.isScanning) {
        try {
          await state.html5QrCodeInstance.stop();
          state.isScanning = false;
        } catch (e) {}
      }
      const startBtn = document.getElementById('btn-start-camera');
      const stopBtn = document.getElementById('btn-stop-camera');
      if (startBtn) startBtn.classList.remove('hidden');
      if (stopBtn) stopBtn.classList.add('hidden');
    }

    function showScanError(msg) {
      const alertBox = document.getElementById('scan-status-alert');
      if (!alertBox) return;
      alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-amber-100', 'text-amber-800');
      alertBox.classList.add('bg-rose-100', 'text-rose-800', 'border', 'border-rose-300');
      alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5 text-base"></i> ${msg}`;
    }

    async function handleScannedToken(qr_token) {
      const res = await apiRequest('/qr/scan', 'POST', { qr_token });
      const alertBox = document.getElementById('scan-status-alert');
      if (!alertBox) return;

      alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800', 'bg-amber-100', 'text-amber-800');

      if (res.success) {
        alertBox.classList.add('bg-emerald-100', 'text-emerald-800', 'border', 'border-emerald-300');
        alertBox.innerHTML = `<i class="fa-solid fa-circle-check text-base mr-1.5"></i> Attendance Marked Successfully`;
        fetchDashboardData();
      } else if (res.message.includes('Already Marked')) {
        alertBox.classList.add('bg-amber-100', 'text-amber-800', 'border', 'border-amber-300');
        alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-base mr-1.5"></i> Attendance Already Marked Today`;
      } else {
        alertBox.classList.add('bg-rose-100', 'text-rose-800', 'border', 'border-rose-300');
        alertBox.innerHTML = `<i class="fa-solid fa-circle-xmark text-base mr-1.5"></i> ${res.message}`;
      }
    }

    function submitManualScan() {
      const tokenVal = document.getElementById('manual-token-input').value;
      const targetToken = tokenVal || (state.activeQRSession ? state.activeQRSession.token : '');
      handleScannedToken(targetToken);
    }

      const msgsBox = document.getElementById('chat-messages');

      const text = msg.toLowerCase();
      if (text.includes('percentage') || text.includes('attendance')) {
        const pct = state.summary ? state.summary.overallPercentage : 100.0;
        reply = ` Your current aggregate attendance is **${pct}%**. Minimum 75% requirement is mandatory.`;
      } else if (text.includes('rule') || text.includes('criteria')) {
        reply = `📋 **Institutional Rules**:\n1. Minimum 75% attendance required.\n2. QR codes expire within the specified duration.\n3. Duplicate attendance on the same day is prohibited.`;
      } else {
        reply = `Hello ${state.user ? state.user.name : ''}! I am your AI Attendance Assistant. How may I assist you with your attendance or role metrics today?`;
      }

      msgsBox.innerHTML += `
        <div class="flex gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-700 text-white flex items-center justify-center text-xs flex-shrink-0">AI</div>
          <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-200 dark:border-slate-700 shadow-sm max-w-[85%] text-slate-700 dark:text-slate-200">
            ${reply.replace(/\n/g, '<br/>')}
          </div>
        </div>
      `;
      msgsBox.scrollTop = msgsBox.scrollHeight;
    }

    // CHART.JS INITIALIZER
    function initCharts() {
      if (!state.user) return;
      const role = state.user.role;

      if (window.myDashboardChartInstance) {
        window.myDashboardChartInstance.destroy();
        window.myDashboardChartInstance = null;
      }
      if (window.myDoughnutChartInstance) {
        window.myDoughnutChartInstance.destroy();
        window.myDoughnutChartInstance = null;
      }

      const ctx1 = document.getElementById('dashboardChart');
      if (ctx1 && role !== 'student' && role !== 'parent') {
        const studentList = state.students || [];
        const labels = studentList.map(s => s.name);
        const dataPct = studentList.map(s => {
          const studentAtts = (state.attendance || []).filter(a => a.raw_student_id === s.user_id || a.roll_number === s.roll_number);
          const attended = studentAtts.filter(a => a.status === 'PRESENT').length;
          return studentAtts.length > 0 ? parseFloat(((attended / studentAtts.length) * 100).toFixed(1)) : 100;
        });

        window.myDashboardChartInstance = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: labels.length > 0 ? labels : ['No Students'],
            datasets: [{
              label: 'Attendance %',
              data: dataPct.length > 0 ? dataPct : [0],
              backgroundColor: dataPct.map(p => p < 75 ? '#f43f5e' : '#2563eb'),
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 100 } }
          }
        });
      }

      const ctx2 = document.getElementById('doughnutChart');
      if (ctx2) {
        let presentCount = 0;
        let absentCount = 0;

        if (role === 'student' || role === 'parent') {
          const summary = state.summary || {};
          presentCount = summary.totalAttended || 0;
          absentCount = summary.totalAbsent || 0;
          if (presentCount === 0 && absentCount === 0) {
            presentCount = (state.attendance || []).filter(a => a.status === 'PRESENT').length;
            absentCount = (state.attendance || []).filter(a => a.status === 'ABSENT').length;
          }
        } else {
          presentCount = (state.attendance || []).filter(a => a.status === 'PRESENT').length;
          absentCount = (state.attendance || []).filter(a => a.status === 'ABSENT').length;
        }

        window.myDoughnutChartInstance = new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: ['Present', 'Absent'],
            datasets: [{
              data: [presentCount, absentCount],
              backgroundColor: ['#10b981', '#f43f5e']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }
  </script>
</body>
