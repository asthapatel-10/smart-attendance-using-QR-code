<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Attendance System | Government Engineering College</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b'  // Deep Emerald
            }
          }
        }
      }
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- HTML5 QR Code Camera Scanner Engine -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .animate-pulse-glow { animation: pulseGlow 2s infinite; }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
      50% { box-shadow: 0 0 30px rgba(16, 185, 129, 0.9); }
    }
    .emerald-gradient { background: linear-gradient(135deg, #064e3b 0%, #065f46 40%, #0f172a 100%); }
    .card-glow:hover { box-shadow: 0 8px 32px rgba(16,185,129,0.18); transform: translateY(-2px); transition: all 0.2s; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen antialiased flex flex-col transition-colors duration-200">

  <!-- MAIN APP CONTAINER -->
  <div id="app" class="flex-1 flex flex-col min-h-0">
    <!-- Rendered dynamically via SPA Router -->
  </div>

  <!-- UNIVERSAL ADD/EDIT USER MODAL -->
  <div id="user-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="bg-brand-900 text-white px-6 py-4 flex items-center justify-between">
        <h3 id="modal-title" class="font-bold text-base"><i class="fa-solid fa-user-gear mr-2"></i>User Details</h3>
        <button onclick="closeUserModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleUserFormSubmit(event)" class="p-6 space-y-4">
        <input type="hidden" id="modal-user-id" value="" />

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">User Role</label>
          <select id="modal-role" onchange="toggleModalRoleFields()" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="mentor">Mentor</option>
            <option value="parent">Parent</option>
            <option value="hod">HOD</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Full Name *</label>
          <input type="text" id="modal-name" required placeholder="e.g. Rahul Sharma" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
            <input type="email" id="modal-email" placeholder="user@attendance.com" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Phone Number</label>
            <input type="text" id="modal-phone" placeholder="+91 9876543210" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
          </div>
        </div>

        <!-- Student Specific Fields -->
        <div id="modal-student-fields" class="space-y-3">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Roll Number (Student ID) *</label>
              <input type="text" id="modal-roll" placeholder="STU104" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Department</label>
              <select id="modal-dept" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
                <option value="Computer Science">Computer Science</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electrical Engineering">Electrical Engineering</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Semester</label>
              <select id="modal-sem" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
                <option value="6">Semester 6</option>
                <option value="1">Semester 1</option>
                <option value="2">Semester 2</option>
                <option value="3">Semester 3</option>
                <option value="4">Semester 4</option>
                <option value="5">Semester 5</option>
                <option value="7">Semester 7</option>
                <option value="8">Semester 8</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Section</label>
              <select id="modal-section" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white">
                <option value="A">Section A</option>
                <option value="B">Section B</option>
                <option value="C">Section C</option>
              </select>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Password</label>
          <input type="password" id="modal-password" placeholder="Leave empty to keep default" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
        </div>

        <div id="modal-err-msg" class="hidden p-2.5 rounded-xl bg-rose-100 border border-rose-300 text-rose-700 text-xs font-medium text-center"></div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeUserModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 text-xs font-semibold hover:bg-slate-300">Cancel</button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-brand-700 text-white text-xs font-bold shadow-md hover:bg-brand-800">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- PASSWORD CHANGE MODAL -->
  <div id="password-change-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
      <div class="bg-brand-900 text-white px-6 py-4 flex items-center justify-between">
        <h3 id="pwd-modal-title" class="font-bold text-base"><i class="fa-solid fa-key mr-2"></i>Change Password</h3>
        <button id="pwd-modal-close-btn" onclick="closePasswordChangeModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handlePasswordChangeSubmit(event)" class="p-6 space-y-4">
        <div id="pwd-modal-notice" class="hidden p-3 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-300 dark:border-amber-800 text-amber-800 dark:text-amber-200 text-xs">
          <i class="fa-solid fa-triangle-exclamation mr-1.5"></i>
          <strong>First Login Setup:</strong> For your security, you are required to change your temporary password before proceeding.
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Current Password *</label>
          <input type="password" id="pwd-current" required placeholder="Enter current / temporary password" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">New Password (min 6 characters) *</label>
          <input type="password" id="pwd-new" required placeholder="Enter new strong password" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Confirm New Password *</label>
          <input type="password" id="pwd-confirm" required placeholder="Confirm new password" class="w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 dark:text-white focus:ring-2 focus:ring-brand-500" />
        </div>

        <div id="pwd-modal-err" class="hidden p-2.5 rounded-xl bg-rose-100 border border-rose-300 text-rose-700 text-xs font-medium text-center"></div>
        <div id="pwd-modal-succ" class="hidden p-2.5 rounded-xl bg-emerald-100 border border-emerald-300 text-emerald-700 text-xs font-medium text-center"></div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="pwd-cancel-btn" onclick="closePasswordChangeModal()" class="px-4 py-2 rounded-xl bg-slate-200 text-slate-700 text-xs font-semibold hover:bg-slate-300">Cancel</button>
          <button type="submit" id="pwd-submit-btn" class="px-5 py-2 rounded-xl bg-brand-700 text-white text-xs font-bold shadow-md hover:bg-brand-800">Update Password</button>
        </div>
      </form>
    </div>
  </div>

  <!-- FLOATING AI CHATBOT WIDGET -->
  <div id="chatbot-container" class="hidden fixed bottom-5 right-5 z-50">
    <button onclick="toggleChatbot()" class="w-14 h-14 rounded-full bg-brand-700 hover:bg-brand-800 text-white flex items-center justify-center shadow-2xl animate-pulse-glow transition transform hover:scale-105">
      <i class="fa-solid fa-robot text-2xl"></i>
    </button>

    <div id="chat-window" class="hidden absolute bottom-16 right-0 w-80 sm:w-96 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col h-[460px]">
      <div class="bg-brand-900 text-white p-4 flex items-center justify-between shadow-md">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
          </div>
          <div>
            <h4 class="font-bold text-sm">College Attendance Assistant</h4>
            <p class="text-xs text-brand-100 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Online</p>
          </div>
        </div>
        <button onclick="toggleChatbot()" class="text-white/80 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 dark:bg-slate-900 text-xs sm:text-sm">
        <div class="flex gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-700 text-white flex items-center justify-center text-xs flex-shrink-0">AI</div>
          <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-200 dark:border-slate-700 shadow-sm max-w-[85%] text-slate-700 dark:text-slate-200">
            Namaste! How can I assist you with your attendance or institutional metrics today?
          </div>
        </div>
      </div>

      <div class="p-2 bg-slate-100 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex gap-1.5 overflow-x-auto text-[11px]">
        <button onclick="sendQuickChat('What is my attendance percentage?')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-medium hover:bg-brand-50">📊 My Percentage</button>
        <button onclick="sendQuickChat('What are the attendance rules?')" class="whitespace-nowrap px-2.5 py-1 rounded-full bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 font-medium hover:bg-brand-50">📋 Rules</button>
      </div>

      <form onsubmit="handleChatSubmit(event)" class="p-3 bg-white dark:bg-slate-850 border-t border-slate-200 dark:border-slate-700 flex gap-2">
        <input type="text" id="chat-input" placeholder="Ask attendance query..." class="flex-1 px-3 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500 dark:text-white" autocomplete="off" />
        <button type="submit" class="px-4 py-2 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-medium text-xs transition">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // Global Application State
    let state = {
      user: null,
      token: localStorage.getItem('token') || null,
      theme: localStorage.getItem('theme') || 'light',
      selectedRolePortal: null, // 'admin' | 'faculty' | 'student' | 'mentor' | 'parent' | 'hod'
      currentTab: 'dashboard',
      students: [],
      faculty: [],
      mentors: [],
      parents: [],
      hods: [],
      users: [],
      attendance: [],
      alerts: [],
      notifications: [],
      subjectSummaries: [],
      subjects: [],
      selectedSubject: 'Data Structures',
      summary: null,
      metrics: null,
      activeQRSession: null,
      qrCountdownInterval: null,
      qrSecondsLeft: 0,
      html5QrCodeInstance: null,
      isScanning: false,
      searchQuery: '',
      filterDepartment: '',
      filterSemester: '',
      filterDate: '',
      mentorAssignments: null
    };

    const API_BASE = '/api';

    // 6 Role Portals Metadata Definitions
    const ROLE_PORTALS = {
      student: { name: 'Student Portal',  icon: 'fa-user-graduate',    bgFrom: 'from-emerald-600', bgTo: 'to-teal-800',    email: '101' },
      faculty: { name: 'Faculty Portal',  icon: 'fa-chalkboard-user',  bgFrom: 'from-teal-600',    bgTo: 'to-emerald-900', email: 'rajesh' },
      mentor:  { name: 'Mentor Portal',   icon: 'fa-handshake',        bgFrom: 'from-emerald-700', bgTo: 'to-slate-900',   email: 'vikram' },
      parent:  { name: 'Parent Portal',   icon: 'fa-user-group',       bgFrom: 'from-amber-600',   bgTo: 'to-orange-800',  email: '101' },
      hod:     { name: 'HOD Portal',      icon: 'fa-building-columns', bgFrom: 'from-teal-800',    bgTo: 'to-slate-900',   email: 'suresh' },
      admin:   { name: 'Admin Portal',    icon: 'fa-user-gear',        bgFrom: 'from-emerald-900', bgTo: 'to-slate-900',   email: 'admin' }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      const hasQrSession = await checkMobileQrScanUrl();
      if (!hasQrSession) {
        if (state.token) {
          fetchCurrentUser();
        } else {
          renderPortalSelect();
        }
      }
    });

    function initTheme() {
      if (state.theme === 'dark' || (!state.theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        state.theme = 'dark';
      } else {
        document.documentElement.classList.remove('dark');
        state.theme = 'light';
      }
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('theme', state.theme);
      initTheme();
      renderApp();
    }

    async function apiRequest(endpoint, method = 'GET', body = null) {
      const headers = { 'Content-Type': 'application/json' };
      if (state.token) headers['Authorization'] = `Bearer ${state.token}`;

      try {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          method,
          headers,
          body: body ? JSON.stringify(body) : null
        });
        return await res.json();
      } catch (e) {
        console.error('API Network Error:', e);
        return { success: false, message: 'Server connection error' };
      }
    }

    async function fetchCurrentUser() {
      try {
        const res = await apiRequest('/auth/me');
        if (res && res.success && res.user) {
          state.user = res.user;
          const cb = document.getElementById('chatbot-container');
          if (cb) cb.classList.remove('hidden');
          await fetchDashboardData();
          if (res.user && res.user.must_change_password) {
            showPasswordChangeModal(true);
          }
        } else {
          logout();
        }
      } catch (err) {
        console.error('Error fetching current user:', err);
        logout();
      }
    }

    async function fetchDashboardData() {
      if (!state.user) {
        renderPortalSelect();
        return;
      }

      const role = state.user.role;

      try {
        // ── Role-based selective data loading ──────────────────────────────────
        // Each role only fetches what it actually needs, reducing API calls.

        if (role === 'parent') {
          // Parent portal: only needs parent-specific endpoints
          await fetchParentData();
          renderApp();
          return;
        }

        if (role === 'student') {
          // Student: needs their own attendance + alerts + notifications + subject summary + timetable
          const queryStr = [];
          if (state.filterDate) queryStr.push(`date=${encodeURIComponent(state.filterDate)}`);
          const attUrl = `/attendance/list${queryStr.length ? '?' + queryStr.join('&') : ''}`;
          const [metricsRes, attRes, alertsRes, notifRes, subjSumRes, sumRes, ttRes] = await Promise.all([
            apiRequest('/reports/metrics'),
            apiRequest(attUrl),
            apiRequest('/alerts/low-attendance'),
            apiRequest('/notifications/history'),
            apiRequest('/attendance/subject-summary'),
            apiRequest('/attendance/summary'),
            apiRequest('/timetable')
          ]);
          if (metricsRes && metricsRes.success) state.metrics = metricsRes.metrics;
          if (attRes && attRes.success) state.attendance = attRes.attendance || [];
          if (alertsRes && alertsRes.success) state.alerts = alertsRes.alerts || [];
          if (notifRes && notifRes.success) state.notifications = notifRes.notifications || [];
          if (subjSumRes && subjSumRes.success) state.subjectSummaries = subjSumRes.subjectSummaries || [];
          if (sumRes && sumRes.success) state.summary = sumRes;
          if (ttRes && ttRes.success) state.timetable = ttRes.timetable || [];
          renderApp();
          return;
        }

        if (role === 'admin') {
          // Admin: needs everything including user management + mentor assignments + timetable
          const queryStr = [];
          if (state.searchQuery) queryStr.push(`search=${encodeURIComponent(state.searchQuery)}`);
          if (state.filterDepartment) queryStr.push(`department=${encodeURIComponent(state.filterDepartment)}`);
          if (state.filterSemester) queryStr.push(`semester=${encodeURIComponent(state.filterSemester)}`);
          if (state.filterDate) queryStr.push(`date=${encodeURIComponent(state.filterDate)}`);
          const attUrl = `/attendance/list${queryStr.length ? '?' + queryStr.join('&') : ''}`;
          const [metricsRes, attRes, stRes, facRes, alertsRes, notifRes, subjSumRes, usersRes, mentorAssignRes, ttRes] = await Promise.all([
            apiRequest('/reports/metrics'),
            apiRequest(attUrl),
            apiRequest('/students'),
            apiRequest('/faculty'),
            apiRequest('/alerts/low-attendance'),
            apiRequest('/notifications/history'),
            apiRequest('/attendance/subject-summary'),
            apiRequest('/users'),
            apiRequest('/mentor/assignments'),
            apiRequest('/timetable')
          ]);
          if (metricsRes && metricsRes.success) state.metrics = metricsRes.metrics;
          if (attRes && attRes.success) state.attendance = attRes.attendance || [];
          if (stRes && stRes.success) state.students = stRes.students || [];
          if (facRes && facRes.success) state.faculty = facRes.faculty || [];
          if (alertsRes && alertsRes.success) state.alerts = alertsRes.alerts || [];
          if (notifRes && notifRes.success) state.notifications = notifRes.notifications || [];
          if (subjSumRes && subjSumRes.success) state.subjectSummaries = subjSumRes.subjectSummaries || [];
          if (usersRes && usersRes.success) state.users = usersRes.users || [];
          if (mentorAssignRes && mentorAssignRes.success) state.mentorAssignments = mentorAssignRes;
          if (ttRes && ttRes.success) state.timetable = ttRes.timetable || [];
          renderApp();
          return;
        }

        if (role === 'hod') {
          // HOD: needs department students, faculty, alerts, notifications, manual mentor allocation data & timetable
          const queryStr = [];
          if (state.searchQuery) queryStr.push(`search=${encodeURIComponent(state.searchQuery)}`);
          if (state.filterDepartment) queryStr.push(`department=${encodeURIComponent(state.filterDepartment)}`);
          if (state.filterSemester) queryStr.push(`semester=${encodeURIComponent(state.filterSemester)}`);
          if (state.filterDate) queryStr.push(`date=${encodeURIComponent(state.filterDate)}`);
          const attUrl = `/attendance/list${queryStr.length ? '?' + queryStr.join('&') : ''}`;
          const [metricsRes, attRes, stRes, facRes, alertsRes, notifRes, subjSumRes, hodMentorRes, ttRes] = await Promise.all([
            apiRequest('/reports/metrics'),
            apiRequest(attUrl),
            apiRequest('/students'),
            apiRequest('/faculty'),
            apiRequest('/alerts/low-attendance'),
            apiRequest('/notifications/history'),
            apiRequest('/attendance/subject-summary'),
            apiRequest('/hod/mentor-assignments'),
            apiRequest('/timetable')
          ]);
          if (metricsRes && metricsRes.success) state.metrics = metricsRes.metrics;
          if (attRes && attRes.success) state.attendance = attRes.attendance || [];
          if (stRes && stRes.success) state.students = stRes.students || [];
          if (facRes && facRes.success) state.faculty = facRes.faculty || [];
          if (alertsRes && alertsRes.success) state.alerts = alertsRes.alerts || [];
          if (notifRes && notifRes.success) state.notifications = notifRes.notifications || [];
          if (subjSumRes && subjSumRes.success) state.subjectSummaries = subjSumRes.subjectSummaries || [];
          if (hodMentorRes && hodMentorRes.success) state.hodMentorData = hodMentorRes;
          if (ttRes && ttRes.success) state.timetable = ttRes.timetable || [];
          renderApp();
          return;
        }

        // Faculty / Mentor: need students, attendance, alerts, notifications, timetable
        {
          const queryStr = [];
          if (state.searchQuery) queryStr.push(`search=${encodeURIComponent(state.searchQuery)}`);
          if (state.filterDepartment) queryStr.push(`department=${encodeURIComponent(state.filterDepartment)}`);
          if (state.filterSemester) queryStr.push(`semester=${encodeURIComponent(state.filterSemester)}`);
          if (state.filterDate) queryStr.push(`date=${encodeURIComponent(state.filterDate)}`);
          const attUrl = `/attendance/list${queryStr.length ? '?' + queryStr.join('&') : ''}`;
          const [metricsRes, attRes, stRes, facRes, alertsRes, notifRes, subjSumRes, ttRes] = await Promise.all([
            apiRequest('/reports/metrics'),
            apiRequest(attUrl),
            apiRequest('/students'),
            apiRequest('/faculty'),
            apiRequest('/alerts/low-attendance'),
            apiRequest('/notifications/history'),
            apiRequest('/attendance/subject-summary'),
            apiRequest('/timetable')
          ]);
          if (metricsRes && metricsRes.success) state.metrics = metricsRes.metrics;
          if (attRes && attRes.success) state.attendance = attRes.attendance || [];
          if (stRes && stRes.success) state.students = stRes.students || [];
          if (facRes && facRes.success) state.faculty = facRes.faculty || [];
          if (alertsRes && alertsRes.success) state.alerts = alertsRes.alerts || [];
          if (notifRes && notifRes.success) state.notifications = notifRes.notifications || [];
          if (subjSumRes && subjSumRes.success) state.subjectSummaries = subjSumRes.subjectSummaries || [];
          if (ttRes && ttRes.success) state.timetable = ttRes.timetable || [];
          renderApp();
        }
      } catch (err) {
        console.error('Error fetching dashboard data:', err);
        renderApp();
      }
    }

    async function handleRoleLoginSubmit(e) {
      e.preventDefault();
      const identityEl = document.getElementById('login-identity');
      const passwordEl = document.getElementById('login-password');
      const errBox = document.getElementById('login-error-msg');
      const btn = document.getElementById('login-submit-btn');
      if (errBox) errBox.classList.add('hidden');

      const originalBtnHtml = btn ? btn.innerHTML : '';
      if (btn) {
        btn.disabled = true;
        btn.classList.add('opacity-75', 'cursor-not-allowed');
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Verifying credentials...</span>';
      }

      const identity = identityEl ? identityEl.value.trim() : '';
      const password = passwordEl ? passwordEl.value : '';
      const role = state.selectedRolePortal;

      try {
        let res;
        if (role === 'parent') {
          res = await apiRequest('/parent/login', 'POST', { student_id: identity, password });
        } else {
          res = await apiRequest('/auth/login', 'POST', { username: identity, email: identity, password, role });
        }

        if (res && res.success) {
          state.token = res.token;
          state.user = res.user;
          state.currentTab = 'dashboard';
          localStorage.setItem('token', res.token);
          if (btn) {
            btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> <span>Access Granted! Opening Portal...</span>';
          }
          const cb = document.getElementById('chatbot-container');
          if (cb) cb.classList.remove('hidden');
          await fetchDashboardData();
          if (res.user && res.user.must_change_password) {
            showPasswordChangeModal(true);
          }
        } else {
          if (btn) {
            btn.disabled = false;
            btn.classList.remove('opacity-75', 'cursor-not-allowed');
            btn.innerHTML = originalBtnHtml;
          }
          if (errBox) {
            errBox.classList.remove('hidden');
            errBox.innerText = (res && res.message) ? res.message : (role === 'parent' ? 'Invalid Student ID or Parent Password.' : 'Invalid credentials provided.');
          }
        }
      } catch (err) {
        console.error('Role login submit error:', err);
        if (btn) {
          btn.disabled = false;
          btn.classList.remove('opacity-75', 'cursor-not-allowed');
          btn.innerHTML = originalBtnHtml;
        }
        if (errBox) {
          errBox.classList.remove('hidden');
          errBox.innerText = 'Server error during login. Please try again.';
        }
      }
    }

      if (tab === 'mentor-assignments' && role !== 'admin') return renderAccessDenied();

      if (tab === 'qr-session' && !['faculty', 'admin'].includes(role)) return renderAccessDenied();
      if (tab === 'qr-scan' && role !== 'student') return renderAccessDenied();

        case 'dashboard': return renderRoleDashboard();

        case 'hod-mentor-allocation': return renderHODMentorAllocationPage();

          </div>
        `;
        return;
      }

      const session = res;
      state.activeFacultySession = session;

      const isAlreadyMarked = (state.attendance || []).some(a => 
        a.student_id === state.user.id && (a.session_id === session.session_id || a.subject === session.subject)
      );

    function startStudentLiveTimer(expiresAt) {
      clearInterval(state.studentTimerInterval);
      state.studentTimerInterval = setInterval(() => {
        const now = new Date();
        const expiry = new Date(expiresAt);
        const diffSecs = Math.floor((expiry - now) / 1000);

        const timerEl = document.getElementById('student-qr-timer');
        if (diffSecs <= 0) {
          clearInterval(state.studentTimerInterval);
          if (timerEl) timerEl.innerText = 'Expired';
          updateLiveAttendanceWidget();
        } else if (timerEl) {
          const mins = Math.floor(diffSecs / 60);
          const secs = diffSecs % 60;
          timerEl.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
      }, 1000);
    }

    async function reassignStudent(studentUserId, newMentorUserId) {
      if (!newMentorUserId) return alert('Please select a mentor first.');
      const res = await apiRequest('/mentor/reassign', 'POST', {
        student_user_id: parseInt(studentUserId),
        new_mentor_user_id: parseInt(newMentorUserId)
      });
      if (res.success) {
        alert('✅ ' + res.message);
        await fetchDashboardData();
      } else {
        alert('❌ Reassignment failed: ' + (res.message || 'Unknown error'));
      }
    }

    async function hodSubmitManualAllocation(studentUserId, mentorUserId) {
      if (!mentorUserId) return alert('Please select a mentor.');
      const res = await apiRequest('/hod/mentor-assign', 'POST', {
        student_user_id: parseInt(studentUserId),
        mentor_user_id: parseInt(mentorUserId)
      });
      if (res.success) {
        alert('✅ ' + res.message);
        await fetchDashboardData();
      } else {
        alert('❌ Assignment failed: ' + (res.message || 'Unknown error'));
      }
    }

    async function hodSubmitReassign(studentUserId, newMentorUserId) {
      if (!newMentorUserId) return alert('Please select a new mentor.');
      const res = await apiRequest('/hod/mentor-reassign', 'POST', {
        student_user_id: parseInt(studentUserId),
        new_mentor_user_id: parseInt(newMentorUserId)
      });
      if (res.success) {
        alert('✅ ' + res.message);
        await fetchDashboardData();
      } else {
        alert('❌ Reassignment failed: ' + (res.message || 'Unknown error'));
      }
    }

    async function hodSubmitRemove(studentUserId) {
      if (!confirm('Are you sure you want to remove this mentor assignment?')) return;
      const res = await apiRequest('/hod/mentor-remove', 'POST', {
        student_user_id: parseInt(studentUserId)
      });
      if (res.success) {
        alert('✅ ' + res.message);
        await fetchDashboardData();
      } else {
        alert('❌ Removal failed: ' + (res.message || 'Unknown error'));
      }
    }

    function renderFacultyStudentAttendanceRows() {
      if (!state.students || state.students.length === 0) {
        return `<tr><td colspan="7" class="py-4 text-center text-slate-400">No student records found.</td></tr>`;
      }

      let filteredStudents = state.students;
      if (state.searchQuery) {
        const q = state.searchQuery.toLowerCase();
        filteredStudents = filteredStudents.filter(s => s.name.toLowerCase().includes(q) || s.roll_number.toLowerCase().includes(q));
      }
      if (state.filterDepartment) {
        filteredStudents = filteredStudents.filter(s => s.department === state.filterDepartment);
      }
      if (state.filterSemester) {
        filteredStudents = filteredStudents.filter(s => String(s.semester) === String(state.filterSemester));
      }

      const currentDate = state.filterDate || new Date().toISOString().split('T')[0];

      return filteredStudents.map(s => {
        const studentAtts = state.attendance.filter(a => a.raw_student_id === s.user_id || a.roll_number === s.roll_number);
        const dateRecord = studentAtts.find(a => a.date === currentDate && (a.subject === (state.selectedSubject || 'Data Structures')));
        
        const attended = studentAtts.filter(a => a.status === 'PRESENT').length;
        const total = studentAtts.length;
        const pct = total > 0 ? ((attended / total) * 100).toFixed(1) : '0.0';

        const currentStatus = dateRecord ? dateRecord.status : 'ABSENT';

        const hasLowAtt = (state.alerts || []).some(a => a.student_id === s.user_id && a.status === 'ACTIVE');
        const lowAttAlert = (state.alerts || []).find(a => a.student_id === s.user_id && a.status === 'ACTIVE');

        return `
          <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50">
            <td class="py-3 px-3 font-bold text-slate-900 dark:text-white">${s.roll_number}</td>
            <td class="py-3 px-3 font-medium dark:text-slate-200">
              ${s.name}
              ${hasLowAtt ? `
                <span title="Low Attendance in ${lowAttAlert?.subject} (${lowAttAlert?.percentage}%)" class="ml-1.5 px-2 py-0.5 rounded text-[10px] font-extrabold bg-rose-600 text-white shadow-sm inline-flex items-center gap-1 animate-pulse">
                  <i class="fa-solid fa-triangle-exclamation"></i> Low Attendance (${lowAttAlert?.subject}: ${lowAttAlert?.percentage}%)
                </span>
              ` : ''}
            </td>
            <td class="py-3 px-3 text-slate-500">${s.department} (Sem ${s.semester})</td>
            <td class="py-3 px-3 text-slate-500">${currentDate}</td>
            <td class="py-3 px-3">
              <span class="px-2.5 py-1 rounded-md text-[10px] font-bold ${currentStatus === 'PRESENT' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">
                ${currentStatus}
              </span>
            </td>
            <td class="py-3 px-3 font-semibold ${parseFloat(pct) < 75 ? 'text-rose-600' : 'text-emerald-600'}">${pct}%</td>
            <td class="py-3 px-3 text-right space-x-1">
              <button onclick="markManualAttendance(${s.user_id}, 'PRESENT', '${currentDate}')" class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-semibold text-[11px] hover:bg-emerald-700">Present</button>
              <button onclick="markManualAttendance(${s.user_id}, 'ABSENT', '${currentDate}')" class="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-semibold text-[11px] hover:bg-rose-700">Absent</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function startQRSession() {
      const duration_minutes = parseInt(document.getElementById('qr-duration').value);
      const subjectSelect = document.getElementById('qr-subject-select');
      const subject = subjectSelect ? subjectSelect.value : 'Data Structures';

      const res = await apiRequest('/qr/generate', 'POST', { duration_minutes, subject });
      if (res.success) {
        state.activeQRSession = res.qrSession || res;
        const container = document.getElementById('qr-display-container');
        const holder = document.getElementById('qr-image-holder');
        const link = document.getElementById('qr-scan-url-link');
        container.classList.remove('hidden');

        const finalQrUrl = res.qr_url || (res.qrSession ? (res.qrSession.qr_url || res.qrSession.scanURL) : '');
        const finalQrImage = res.qrSession?.qrImageURL || res.qrImageURL || '';

        holder.innerHTML = `<img src="${finalQrImage}" alt="Classroom QR Code" class="w-72 h-72 rounded-xl shadow-md border bg-white p-2" />`;
        if (link) {
          link.href = finalQrUrl;
          link.innerText = finalQrUrl;
        }

        state.qrSecondsLeft = duration_minutes * 60;
        clearInterval(state.qrCountdownInterval);
        state.qrCountdownInterval = setInterval(() => {
          state.qrSecondsLeft--;
          const mins = Math.floor(state.qrSecondsLeft / 60);
          const secs = state.qrSecondsLeft % 60;
          const timerEl = document.getElementById('qr-timer-text');
          if (timerEl) {
            timerEl.innerText = `Valid for: ${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
          }

          if (state.qrSecondsLeft <= 0) {
            clearInterval(state.qrCountdownInterval);
            if (timerEl) timerEl.innerText = '❌ QR Code Expired';
          }
        }, 1000);
      } else {
        alert(res.message);
      }
    }

        await apiRequest('/qr/stop', 'POST', { qr_id: state.activeQRSession.id, session_id: state.activeQRSession.session_id });
        clearInterval(state.qrCountdownInterval);
        document.getElementById('qr-display-container').classList.add('hidden');
        alert('QR Session ended manually.');
      }
    }

      if (!sessionId && window.location.hash) {
        const hashMatch = window.location.hash.match(/[?&]session=([^&]+)/);
        if (hashMatch) sessionId = hashMatch[1];
      }

      if (sessionId) {
        state.mobileSessionId = sessionId;
        const res = await apiRequest(`/qr/session-info?session_id=${encodeURIComponent(sessionId)}`);

          state.mobileSessionData = { session_id: sessionId, is_expired: true, errorMsg: res.message };

        renderMobileQrScanView();
        return true;

    async function startCameraScanner() {
      const alertBox = document.getElementById('scan-status-alert');
      if (alertBox) alertBox.classList.add('hidden');

      try {
        if (state.html5QrCodeInstance && state.isScanning) {
          await state.html5QrCodeInstance.stop();
          state.isScanning = false;
        }

        if (!state.html5QrCodeInstance) {
          state.html5QrCodeInstance = new Html5Qrcode("reader");
        }

        const startBtn = document.getElementById('btn-start-camera');
        const stopBtn = document.getElementById('btn-stop-camera');
        if (startBtn) startBtn.classList.add('hidden');
        if (stopBtn) stopBtn.classList.remove('hidden');

        const qrCodeSuccessCallback = (decodedText, decodedResult) => {
          handleScannedToken(decodedText);
        };

        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        state.html5QrCodeInstance.start({ facingMode: "environment" }, config, qrCodeSuccessCallback)
          .then(() => {
            state.isScanning = true;
          })
          .catch(async (err) => {
            try {
              const cameras = await Html5Qrcode.getCameras();
              if (cameras && cameras.length > 0) {
                await state.html5QrCodeInstance.start(cameras[0].id, config, qrCodeSuccessCallback);
                state.isScanning = true;
              } else {
                showScanError('No camera detected on this device.');
              }
            } catch (e) {
              showScanError('Camera permission denied or camera unavailable. Please allow camera access in browser.');
            }
          });
      } catch (err) {
        showScanError('Camera initialization error: ' + err.message);
      }
    }

    async function stopCameraScanner() {
      if (state.html5QrCodeInstance && state.isScanning) {
        try {
          await state.html5QrCodeInstance.stop();
          state.isScanning = false;
        } catch (e) {}
      }
      const startBtn = document.getElementById('btn-start-camera');
      const stopBtn = document.getElementById('btn-stop-camera');
      if (startBtn) startBtn.classList.remove('hidden');
      if (stopBtn) stopBtn.classList.add('hidden');
    }

    function showScanError(msg) {
      const alertBox = document.getElementById('scan-status-alert');
      if (!alertBox) return;
      alertBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-amber-100', 'text-amber-800');
      alertBox.classList.add('bg-rose-100', 'text-rose-800', 'border', 'border-rose-300');
      alertBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation mr-1.5 text-base"></i> ${msg}`;
    }

    function extractSessionIdFromScannedText(text) {
      if (!text) return '';
      let str = String(text).trim();
      if (str.startsWith('ATTENDANCE_SESSION:')) {
        return str.substring('ATTENDANCE_SESSION:'.length).trim();
      }
      try {
        if (str.includes('?')) {
          const urlObj = new URL(str, 'http://localhost');
          const sess = urlObj.searchParams.get('session') || urlObj.searchParams.get('session_id') || urlObj.searchParams.get('token');
          if (sess) return sess;
        }
      } catch (e) {}
      const sessMatch = str.match(/(SESS_[A-Za-z0-9_]+)/);
      if (sessMatch) return sessMatch[1];
      return str;
    }

      document.getElementById('tt-entry-id').value = '';
      document.getElementById('tt-modal-title').innerText = 'Add Timetable Entry';
      document.getElementById('tt-subject').value = '';
      document.getElementById('tt-start-time').value = '10:00 AM';
      document.getElementById('tt-end-time').value = '11:00 AM';
      document.getElementById('tt-department').value = state.user.department || 'Computer Science';
      document.getElementById('tt-semester').value = state.user.semester || '6';
      document.getElementById('tt-division').value = 'A';
      document.getElementById('tt-room').value = 'Room 204';
      document.getElementById('tt-faculty-name').value = 'Prof. Rajesh Patel';
      document.getElementById('timetable-modal').classList.remove('hidden');
    }

    function closeTimetableModal() {
      document.getElementById('timetable-modal').classList.add('hidden');
    }

    function editTimetableEntry(id) {
      const entry = (state.timetable || []).find(t => t.id === id);
      if (!entry) return;
      document.getElementById('tt-entry-id').value = entry.id;
      document.getElementById('tt-modal-title').innerText = 'Edit Timetable Entry';
      document.getElementById('tt-day').value = (entry.day || 'MONDAY').toUpperCase();
      document.getElementById('tt-subject').value = entry.subject || '';
      document.getElementById('tt-start-time').value = entry.start_time || '10:00 AM';
      document.getElementById('tt-end-time').value = entry.end_time || '11:00 AM';
      document.getElementById('tt-department').value = entry.department || 'Computer Science';
      document.getElementById('tt-semester').value = entry.semester || '6';
      document.getElementById('tt-division').value = entry.division || 'A';
      document.getElementById('tt-room').value = entry.room || 'Room 204';
      document.getElementById('tt-faculty-name').value = entry.faculty_name || 'Prof. Rajesh Patel';
      document.getElementById('timetable-modal').classList.remove('hidden');
    }

    async function deleteTimetableEntry(id) {
      if (!confirm('Are you sure you want to delete this timetable entry?')) return;
      const res = await apiRequest('/timetable/delete', 'POST', { id });
      if (res.success) {
        state.timetable = state.timetable.filter(t => t.id !== id);
        renderApp();
      } else {
        alert(res.message);
      }
    }

    async function handleTimetableFormSubmit(e) {
      e.preventDefault();
      const id = document.getElementById('tt-entry-id').value;
      const day = document.getElementById('tt-day').value;
      const start_time = document.getElementById('tt-start-time').value;
      const end_time = document.getElementById('tt-end-time').value;
      const subject = document.getElementById('tt-subject').value;
      const department = document.getElementById('tt-department').value;
      const semester = parseInt(document.getElementById('tt-semester').value) || 6;
      const division = document.getElementById('tt-division').value;
      const room = document.getElementById('tt-room').value;
      const faculty_name = document.getElementById('tt-faculty-name').value;

      const payload = { day, start_time, end_time, subject, department, semester, division, room, faculty_name };
      if (id) payload.id = parseInt(id);

      const endpoint = id ? '/timetable/update' : '/timetable/create';
      const res = await apiRequest(endpoint, 'POST', payload);

      if (res.success) {
        closeTimetableModal();
        const fetchRes = await apiRequest('/timetable');
        if (fetchRes.success) state.timetable = fetchRes.timetable;
        renderApp();
      } else {
        alert(res.message || 'Action failed.');
      }
    }

      document.getElementById('modal-user-id').value = '';
      document.getElementById('modal-name').value = '';
      document.getElementById('modal-email').value = '';
      document.getElementById('modal-phone').value = '';
      document.getElementById('modal-roll').value = '';
      document.getElementById('modal-password').value = '';
      document.getElementById('user-modal').classList.remove('hidden');
      toggleModalRoleFields();
    }

    function openAddStudentModal() {
      openAddUserModal();
      document.getElementById('modal-role').value = 'student';
      toggleModalRoleFields();
    }

    function openEditUserModal(userId) {
      const user = state.users.find(u => u.id === userId) || state.students.find(s => s.user_id === userId);
      if (!user) return;

      document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-pen-to-square mr-2"></i>Edit User Profile';
      document.getElementById('modal-user-id').value = user.id || user.user_id;
      document.getElementById('modal-name').value = user.name || '';
      document.getElementById('modal-email').value = user.email || '';
      document.getElementById('modal-phone').value = user.phone || '';
      document.getElementById('modal-roll').value = user.roll_number || user.roleDetails?.roll_number || '';
      document.getElementById('modal-role').value = user.role || 'student';
      document.getElementById('user-modal').classList.remove('hidden');
      toggleModalRoleFields();
    }

    function toggleModalRoleFields() {
      const role = document.getElementById('modal-role').value;
      const stFields = document.getElementById('modal-student-fields');
      if (role === 'student') stFields.classList.remove('hidden');
      else stFields.classList.add('hidden');
    }

    function closeUserModal() {
      document.getElementById('user-modal').classList.add('hidden');
      document.getElementById('modal-err-msg').classList.add('hidden');
    }

    async function handleUserFormSubmit(e) {
      e.preventDefault();
      const userId = document.getElementById('modal-user-id').value;
      const role = document.getElementById('modal-role').value;
      const name = document.getElementById('modal-name').value;
      const email = document.getElementById('modal-email').value;
      const phone = document.getElementById('modal-phone').value;
      const roll_number = document.getElementById('modal-roll').value;
      const department = document.getElementById('modal-dept').value;
      const semester = document.getElementById('modal-sem').value;
      const section = document.getElementById('modal-section').value;
      const password = document.getElementById('modal-password').value;

      let res;
      if (userId) {
        res = await apiRequest('/users/update', 'PUT', { user_id: userId, name, email, phone, roll_number, department, semester, section });
      } else {
        res = await apiRequest('/users/create', 'POST', { role, name, email, phone, roll_number, department, semester, section, password });
      }

      if (res.success) {
        closeUserModal();
        fetchDashboardData();
      } else {
        const errBox = document.getElementById('modal-err-msg');
        errBox.classList.remove('hidden');
        errBox.innerText = res.message;
      }
    }

    async function deleteUserRecord(id) {
      if (confirm('Are you sure you want to delete this user record?')) {
        await apiRequest(`/users/${id}`, 'DELETE');
        fetchDashboardData();
      }
    }

    // PASSWORD CHANGE MODAL HANDLERS
    function showPasswordChangeModal(isMandatory = false) {
      state.isPasswordChangeMandatory = !!isMandatory;
      const modal = document.getElementById('password-change-modal');
      const notice = document.getElementById('pwd-modal-notice');
      const closeBtn = document.getElementById('pwd-modal-close-btn');
      const cancelBtn = document.getElementById('pwd-cancel-btn');
      const errBox = document.getElementById('pwd-modal-err');
      const succBox = document.getElementById('pwd-modal-succ');

      if (errBox) errBox.classList.add('hidden');
      if (succBox) succBox.classList.add('hidden');
      const currInput = document.getElementById('pwd-current');
      const newInput = document.getElementById('pwd-new');
      const confInput = document.getElementById('pwd-confirm');
      if (currInput) currInput.value = '';
      if (newInput) newInput.value = '';
      if (confInput) confInput.value = '';

      if (isMandatory) {
        if (notice) notice.classList.remove('hidden');
        if (closeBtn) closeBtn.classList.add('hidden');
        if (cancelBtn) cancelBtn.classList.add('hidden');
      } else {
        if (notice) notice.classList.add('hidden');
        if (closeBtn) closeBtn.classList.remove('hidden');
        if (cancelBtn) cancelBtn.classList.remove('hidden');
      }

      if (modal) modal.classList.remove('hidden');
    }

    function closePasswordChangeModal() {
      if (state.isPasswordChangeMandatory) return;
      const modal = document.getElementById('password-change-modal');
      if (modal) modal.classList.add('hidden');
    }

    async function handlePasswordChangeSubmit(e) {
      e.preventDefault();
      const current_password = document.getElementById('pwd-current').value;
      const new_password = document.getElementById('pwd-new').value;
      const confirm_password = document.getElementById('pwd-confirm').value;
      const errBox = document.getElementById('pwd-modal-err');
      const succBox = document.getElementById('pwd-modal-succ');
      const submitBtn = document.getElementById('pwd-submit-btn');

      if (errBox) errBox.classList.add('hidden');
      if (succBox) succBox.classList.add('hidden');

      if (new_password !== confirm_password) {
        if (errBox) {
          errBox.classList.remove('hidden');
          errBox.innerText = 'New password and confirm password do not match.';
        }
        return;
      }

      if (new_password.length < 6) {
        if (errBox) {
          errBox.classList.remove('hidden');
          errBox.innerText = 'New password must be at least 6 characters long.';
        }
        return;
      }

      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = 'Updating...';
      }

      const res = await apiRequest('/auth/change-password', 'POST', { current_password, new_password });

      if (submitBtn) {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Update Password';
      }

      if (res && res.success) {
        if (succBox) {
          succBox.classList.remove('hidden');
          succBox.innerText = 'Password updated successfully!';
        }
        state.isPasswordChangeMandatory = false;
        if (state.user) state.user.must_change_password = false;
        setTimeout(() => {
          const modal = document.getElementById('password-change-modal');
          if (modal) modal.classList.add('hidden');
        }, 1200);
      } else {
        if (errBox) {
          errBox.classList.remove('hidden');
          errBox.innerText = (res && res.message) ? res.message : 'Failed to update password.';
        }
      }
    }

    // CHATBOT CONTROLLERS
    function toggleChatbot() {
      document.getElementById('chat-window').classList.toggle('hidden');
    }

    function sendQuickChat(txt) {
      document.getElementById('chat-input').value = txt;
      handleChatSubmit(new Event('submit'));
    }

    async function handleChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const msg = input.value.trim();
      if (!msg) return;

      const msgsBox = document.getElementById('chat-messages');
      msgsBox.innerHTML += `
        <div class="flex gap-2 justify-end">
          <div class="bg-brand-700 text-white p-3 rounded-2xl rounded-tr-none shadow-sm max-w-[85%] text-xs">
            ${msg}
          </div>
        </div>
      `;

      input.value = '';
      msgsBox.scrollTop = msgsBox.scrollHeight;

      const loadingId = 'ai-typing-' + Date.now();
      msgsBox.innerHTML += `
        <div id="${loadingId}" class="flex gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-700 text-white flex items-center justify-center text-xs flex-shrink-0">AI</div>
          <div class="bg-white dark:bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-200 dark:border-slate-700 shadow-sm max-w-[85%] text-slate-500 italic text-xs">
            <i class="fa-solid fa-circle-notch fa-spin mr-1"></i> Searching records...
          </div>
        </div>
      `;
      msgsBox.scrollTop = msgsBox.scrollHeight;

      let reply = '';
      try {
        const res = await apiRequest('/chat', 'POST', { message: msg });
        if (res && res.success && res.reply) {
          reply = res.reply;
        } else if (res && res.message) {
          reply = res.message;
        } else {
          reply = 'Sorry, could not process your query at this moment.';
        }
      } catch (err) {
        reply = 'An error occurred while contacting the chatbot service.';
      }

      const typingEl = document.getElementById(loadingId);
      if (typingEl) typingEl.remove();

      // Format markdown bold & line breaks
      let formattedReply = reply
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code class="bg-slate-100 dark:bg-slate-700 px-1 py-0.5 rounded text-[11px] font-mono text-brand-700 dark:text-brand-300">$1</code>')
        .replace(/\n/g, '<br/>');

      msgsBox.innerHTML += `
        <div class="flex gap-2">
          <div class="w-7 h-7 rounded-full bg-brand-700 text-white flex items-center justify-center text-xs flex-shrink-0">AI</div>
          <div class="bg-white dark:bg-slate-800 p-3.5 rounded-2xl rounded-tl-none border border-slate-200 dark:border-slate-700 shadow-sm max-w-[85%] text-slate-700 dark:text-slate-200 text-xs leading-relaxed">
            ${formattedReply}
          </div>
        </div>
      `;
      msgsBox.scrollTop = msgsBox.scrollHeight;
    }

    // CHART.JS INITIALIZER
    function initCharts() {
      if (!state.user) return;
      const role = state.user.role;

      if (window.myDashboardChartInstance) {
        window.myDashboardChartInstance.destroy();
        window.myDashboardChartInstance = null;
      }
      if (window.myDoughnutChartInstance) {
        window.myDoughnutChartInstance.destroy();
        window.myDoughnutChartInstance = null;
      }

      const ctx1 = document.getElementById('dashboardChart');
      if (ctx1 && role !== 'student' && role !== 'parent') {
        const studentList = state.students || [];
        const labels = studentList.map(s => s.name);
        const dataPct = studentList.map(s => {
          const studentAtts = (state.attendance || []).filter(a => a.raw_student_id === s.user_id || a.roll_number === s.roll_number);
          const attended = studentAtts.filter(a => a.status === 'PRESENT').length;
          return studentAtts.length > 0 ? parseFloat(((attended / studentAtts.length) * 100).toFixed(1)) : 0;
        });

        window.myDashboardChartInstance = new Chart(ctx1, {
          type: 'bar',
          data: {
            labels: labels.length > 0 ? labels : ['No Students'],
            datasets: [{
              label: 'Attendance %',
              data: dataPct.length > 0 ? dataPct : [0],
              backgroundColor: dataPct.map(p => p < 75 ? '#f43f5e' : '#10b981'),
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 100 } }
          }
        });
      }

      const ctx2 = document.getElementById('doughnutChart');
      if (ctx2) {
        let presentCount = 0;
        let absentCount = 0;

        if (role === 'student' || role === 'parent') {
          const summary = state.summary || {};
          presentCount = summary.totalAttended || 0;
          absentCount = summary.totalAbsent || 0;
          if (presentCount === 0 && absentCount === 0) {
            presentCount = (state.attendance || []).filter(a => a.status === 'PRESENT').length;
            absentCount = (state.attendance || []).filter(a => a.status === 'ABSENT').length;
          }
        } else {
          presentCount = (state.attendance || []).filter(a => a.status === 'PRESENT').length;
          absentCount = (state.attendance || []).filter(a => a.status === 'ABSENT').length;
        }

        window.myDoughnutChartInstance = new Chart(ctx2, {
          type: 'doughnut',
          data: {
            labels: ['Present', 'Absent'],
            datasets: [{
              data: [presentCount, absentCount],
              backgroundColor: ['#10b981', '#f43f5e']
            }]
          },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }
    }
  </script>
