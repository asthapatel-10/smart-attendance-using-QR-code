services:
  - type: web
    name: smart-attendance-system
    runtime: node
    plan: free
    region: oregon
    branch: master
    buildCommand: npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: smart_attendance
      - key: MONGODB_COLLECTION
        value: system_store
